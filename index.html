<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d7ddde" />
    <title>C3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <video class="theme-background" id="theme-background" autoplay muted loop playsinline aria-hidden="true"></video>
    <main class="launcher" aria-label="C3 launcher">
      <div class="logo-wrap"><img class="logo" src="assets/logo.png" alt="C3" /></div>
      <p class="changing-footer" aria-live="polite">inspired by x8rs cherri</p>
      <nav class="toolbelt" aria-label="Toolbelt">
        <div class="toolbelt-surface" aria-hidden="true"></div>
        <button class="tool active" data-view="home" aria-label="Home"><img src="assets/home.png" alt="" /></button>
        <span class="divider" aria-hidden="true"></span>
        <button class="tool" data-view="browser" aria-label="Browser"><img src="assets/browser.png" alt="" /></button>
        <button class="tool" data-view="games" aria-label="Games"><img src="assets/games.png" alt="" /></button>
        <button class="tool" data-view="music" aria-label="Music"><img src="assets/msuic.png" alt="" /></button>
        <button class="tool" data-view="settings" aria-label="Settings"><img src="assets/settings.png" alt="" /></button>
      </nav>
    </main>

    <section class="workspace" aria-live="polite">
      <button class="workspace-close" aria-label="Close tool">×</button>
      <div class="workspace-content" id="workspace-content"></div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
